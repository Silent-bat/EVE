# EVE backend stack — Postgres + the Node API.
#
# Usage:
#   docker compose up -d           # start everything
#   docker compose logs -f api     # tail API logs
#   docker compose down            # stop
#
# Reads .env at the workspace root for secrets (Google client id/secret,
# GEMINI_API_KEY, etc). Provide them there before bringing the stack up.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api-node/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 8080
      LOG_LEVEL: info
      EVE_DATA_DIR: /app/.eve-data
      DATABASE_URL: postgresql://eve:eve@postgres:5432/eve
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Pass through everything else from .env:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUTH_TOKEN_TTL_DAYS: ${AUTH_TOKEN_TTL_DAYS:-30}
      AUTH_RATELIMIT_IP_PER_MIN: ${AUTH_RATELIMIT_IP_PER_MIN:-5}
      AUTH_RATELIMIT_EMAIL_PER_15MIN: ${AUTH_RATELIMIT_EMAIL_PER_15MIN:-20}
      USER_RATELIMIT_PER_MIN: ${USER_RATELIMIT_PER_MIN:-30}
      VOICE_MAX_CONNECTIONS_PER_USER: ${VOICE_MAX_CONNECTIONS_PER_USER:-2}
      VOICE_MAX_AUDIO_BYTES: ${VOICE_MAX_AUDIO_BYTES:-2000000}
      VOICE_MAX_SESSION_MS: ${VOICE_MAX_SESSION_MS:-900000}
      VOICE_IDLE_TIMEOUT_MS: ${VOICE_IDLE_TIMEOUT_MS:-600000}
      OUTBOUND_TIMEOUT_MS: ${OUTBOUND_TIMEOUT_MS:-15000}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-10000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      GOOGLE_RESPONSE_MAX_BYTES: ${GOOGLE_RESPONSE_MAX_BYTES:-2000000}
      GMAIL_MAX_BODY_CHARS: ${GMAIL_MAX_BODY_CHARS:-20000}
      GMAIL_FETCH_CONCURRENCY: ${GMAIL_FETCH_CONCURRENCY:-6}
      GEMINI_PROMPT_MAX_CHARS: ${GEMINI_PROMPT_MAX_CHARS:-120000}
      DEVICE_NOTIFICATION_RETENTION_DAYS: ${DEVICE_NOTIFICATION_RETENTION_DAYS:-30}
      STATE_ENCRYPTION_KEY: ${STATE_ENCRYPTION_KEY:-}
    volumes:
      - eve-data:/app/.eve-data
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  eve-data:
